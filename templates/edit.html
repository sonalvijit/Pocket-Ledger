{% extends "base.html" %}
{% block title %}Edit expense · Pocket Ledger{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">YOUR MONEY, IN VIEW</div><h1>Edit expense</h1><p class="subtitle">Update the details for this ledger entry.</p></div><a class="text-link" href="{{ url_for('index') }}">← Back to transactions</a></div>
<section class="edit-card"><form method="post" class="expense-form"><label for="product">PRODUCT OR EXPENSE</label><input id="product" name="product" type="text" maxlength="120" value="{{ entry.product }}" required><div class="form-row"><div class="form-field"><label for="amount">AMOUNT PAID (₹)</label><input id="amount" name="amount" type="number" min="0" step="0.01" value="{{ '%.2f'|format(entry.amount_cents / 100) }}" required></div><div class="form-field"><label for="category">CATEGORY</label><select id="category" name="category" required>{% for cat in categories %}<option value="{{ cat }}" {% if entry.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></div></div><div class="form-row quantity-row"><div class="form-field"><label for="quantity">QUANTITY</label><input id="quantity" name="quantity" type="number" min="0.001" max="999999999" step="0.001" value="{{ '%g'|format(entry.quantity) }}" required></div><div class="form-field"><label for="quantity_unit">UNIT</label><select id="quantity_unit" name="quantity_unit" required>{% if entry.quantity_unit not in quantity_units %}<option value="{{ entry.quantity_unit }}" selected>{{ entry.quantity_unit }}</option>{% endif %}{% for unit in quantity_units %}<option value="{{ unit }}" {% if entry.quantity_unit == unit %}selected{% endif %}>{% if unit == 'none' %}None (not applicable){% else %}{{ unit }}{% endif %}</option>{% endfor %}</select></div></div><div class="form-row mrp-row"><div class="form-field"><label for="mrp">MRP RATE (₹) · OPTIONAL</label><input id="mrp" name="mrp" type="number" min="0" step="0.01" value="{{ '%.2f'|format(entry.mrp_cents / 100) if entry.mrp_cents is not none else '' }}" placeholder="e.g. 120.00"></div><div class="form-field"><label for="mrp_unit">MRP IS PER</label><select id="mrp_unit" name="mrp_unit"><option value="">Choose rate unit</option>{% for unit in mrp_units %}<option value="{{ unit }}" {% if entry.mrp_unit == unit %}selected{% endif %}>{{ unit }}</option>{% endfor %}</select></div></div><div class="form-field spender-field"><label for="spent_by">SPENT BY</label><select id="spent_by" name="spent_by" required>{% if entry.spent_by not in spenders %}<option value="{{ entry.spent_by }}" selected>{{ entry.spent_by }}</option>{% endif %}{% for spender in spenders %}<option value="{{ spender }}" {% if entry.spent_by == spender %}selected{% endif %}>{{ spender }}</option>{% endfor %}</select></div><p class="edit-date">Originally recorded {{ entry.created_at|replace('T', ' · ') }}</p><button class="button submit-button" type="submit">Save changes <span>↗</span></button></form></section>
{% endblock %}
